services:
  mtr:
    image: mtr:0135
    pull_policy: never            # образ уже загружен, не ходить в Docker Hub
    container_name: mtr-app
    restart: always
    env_file: .env                # все переменные окружения берутся из .env
    ports:
      - "${MTR_PORT:-4533}:4533"
    volumes:
      - "${MUSIC_PATH:?задайте MUSIC_PATH в .env}:/music:ro"
      - "${DATA_PATH:?задайте DATA_PATH в .env}:/data"

